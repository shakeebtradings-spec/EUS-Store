<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EUS Assets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --paper:#E7EBEF; --surface:#FFFFFF; --ink:#15202B; --ink-soft:#5B6C7D;
    --hair:#D2D9E0; --gold:#C8A24C; --gold-deep:#8C6B1F; --teal:#146B63; --rust:#9E3B2E;
    --r:10px; --shadow:0 1px 0 rgba(21,32,43,.06), 0 8px 24px -18px rgba(21,32,43,.5);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);
    font-family:'Barlow',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
    font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
    padding-bottom:calc(78px + env(safe-area-inset-bottom))}
  body.has-basket{padding-bottom:calc(140px + env(safe-area-inset-bottom))}
  .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
  .num{font-variant-numeric:tabular-nums}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  select{width:100%;background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);padding:13px 12px}
  :focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px;border-radius:4px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  .wrap{max-width:540px;margin:0 auto;padding:0 14px}

  header{background:var(--ink);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 0 10px;position:sticky;top:0;z-index:40}
  .hbar{display:flex;align-items:center;gap:10px}
  .htitle{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;line-height:1;letter-spacing:.02em}
  .hsub{color:#9FB0C0;font-size:12.5px;line-height:1.2;margin-top:2px;display:flex;align-items:center;gap:6px}
  .hspace{flex:1}
  .chip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:999px;
        padding:6px 12px;font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);flex:none}
  .live-dot{width:7px;height:7px;border-radius:50%;background:#2FBF71;flex:none;animation:pulse 2.4s infinite}
  .live-dot.off{background:var(--rust);animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,191,113,.55)}70%{box-shadow:0 0 0 7px rgba(47,191,113,0)}100%{box-shadow:0 0 0 0 rgba(47,191,113,0)}}
  .banner{display:none;background:var(--rust);color:#fff;font-size:14px;padding:9px 14px;align-items:center;gap:10px;position:sticky;top:0;z-index:39}
  .banner.on{display:flex}

  main{padding-top:14px}
  .screen{display:none}
  .screen.on{display:block}

  .viewport{position:relative;background:#0D1620;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;
            display:flex;align-items:center;justify-content:center;text-align:center}
  #cam,#reader{position:absolute;inset:0;width:100%;height:100%;display:none}
  #cam{object-fit:cover;background:#0D1620}
  #reader video{width:100%!important;height:100%!important;object-fit:cover}
  .vp-idle{padding:22px;color:#A9B8C6;font-size:14.5px;max-width:300px;position:relative;z-index:2}
  .brackets>i{position:absolute;width:30px;height:30px;border:2px solid var(--gold);pointer-events:none;z-index:3}
  .brackets>i:nth-child(1){top:12px;left:12px;border-right:0;border-bottom:0}
  .brackets>i:nth-child(2){top:12px;right:12px;border-left:0;border-bottom:0}
  .brackets>i:nth-child(3){bottom:12px;left:12px;border-right:0;border-top:0}
  .brackets>i:nth-child(4){bottom:12px;right:12px;border-left:0;border-top:0}
  .guide{position:absolute;left:8%;right:8%;top:50%;height:2px;background:rgba(200,162,76,.85);z-index:3;display:none}
  .viewport.live .guide{display:block}
  .torch{position:absolute;right:12px;bottom:12px;z-index:4;background:rgba(13,22,32,.72);border:1px solid rgba(255,255,255,.25);
         color:#fff;border-radius:999px;padding:8px 14px;font-size:13.5px;display:none}
  .torch.on{display:block}
  .torch.lit{background:var(--gold);color:#1B1405;border-color:var(--gold)}

  .btn{display:block;width:100%;text-align:center;padding:15px 16px;border-radius:var(--r);font-weight:600;font-size:16.5px;background:var(--gold);color:#1B1405}
  .btn:active{transform:translateY(1px)}
  .btn.dark{background:var(--ink);color:#fff}
  .btn.teal{background:var(--teal);color:#fff}
  .btn.ghost{background:transparent;border:1px solid var(--hair);color:var(--ink);font-weight:500}
  .btn.sm{padding:9px 10px;font-size:14px}
  .btn[disabled]{opacity:.45;pointer-events:none}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .mt{margin-top:12px}.mt-s{margin-top:8px}.mt-l{margin-top:22px}
  .field{display:flex;gap:8px}
  input[type=text],input[type=password],input[type=email],input[type=number],textarea{
    width:100%;background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);padding:13px 12px}
  textarea{min-height:120px;resize:vertical}
  label.lbl{display:block;font-size:13px;color:var(--ink-soft);margin:14px 0 5px;font-weight:500}
  .hint{font-size:13px;color:var(--ink-soft);margin-top:10px}

  .list{margin-top:12px;display:flex;flex-direction:column;gap:8px}
  .tag{display:flex;background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);width:100%;text-align:left}
  .stub{width:7px;flex:none;background:var(--teal)}
  .stub.part{background:var(--gold)}
  .stub.none{background:var(--rust)}
  .tag-body{padding:11px 12px;flex:1;min-width:0}
  .tag-name{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  .tag-meta{font-size:13px;color:var(--ink-soft);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .tag-count{padding:11px 13px;text-align:right;flex:none;border-left:1px dashed var(--hair);
             display:flex;flex-direction:column;justify-content:center;min-width:74px}
  .big{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:30px;line-height:.9;font-variant-numeric:tabular-nums}
  .small{font-size:11.5px;color:var(--ink-soft);margin-top:3px}
  .low{color:var(--rust)}
  .pill{background:#EDF1F5;border-radius:5px;padding:1px 7px;font-size:12.5px;color:var(--ink-soft)}
  .st{font-size:11.5px;font-weight:600;border-radius:5px;padding:2px 7px;flex:none}
  .st.in{background:#E3F1EE;color:var(--teal)}
  .st.issued{background:#FBF1DC;color:var(--gold-deep)}
  .st.repair{background:#EDF1F5;color:var(--ink-soft)}
  .st.retired{background:#F6E4E1;color:var(--rust)}
  .flash{animation:flash 1.1s ease-out}
  @keyframes flash{0%{background:#FFF6DF}100%{background:var(--surface)}}
  .section-head{display:flex;align-items:baseline;gap:10px;margin:18px 0 2px}
  .section-head h2{font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:600;margin:0}
  .count{font-size:13px;color:var(--ink-soft)}
  .empty{background:var(--surface);border:1px dashed var(--hair);border-radius:var(--r);padding:26px 20px;
         text-align:center;color:var(--ink-soft);font-size:14.5px;margin-top:12px}
  .unit{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--hair);
        border-radius:8px;padding:10px 11px;margin-top:6px;width:100%;text-align:left}
  .unit .u-main{flex:1;min-width:0}
  .unit .u-ser{font-family:'JetBrains Mono',monospace;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .unit .u-sub{font-size:12.5px;color:var(--ink-soft)}
  .person-card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px;margin-top:10px}
  .person-top{display:flex;align-items:baseline;gap:8px}
  .person-top h3{font-family:'Barlow Condensed',sans-serif;font-size:21px;margin:0;font-weight:700}
  .log-item{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--hair)}
  .verb{font-weight:600;font-size:13px;width:62px;flex:none;padding-top:1px}
  .verb.out{color:var(--rust)}.verb.in{color:var(--teal)}.verb.set{color:var(--gold-deep)}
  .log-main{flex:1;min-width:0}
  .log-when{font-size:12.5px;color:var(--ink-soft);margin-top:1px;display:block}

  .basket-bar{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom));z-index:45;display:none}
  .basket-bar.on{display:block}
  .basket-btn{display:flex;align-items:center;gap:10px;width:100%;background:var(--ink);color:#fff;
              border-radius:var(--r);padding:13px 15px;box-shadow:0 10px 26px -14px rgba(0,0,0,.8);font-weight:600}
  .chipn{background:var(--gold);color:#1B1405;border-radius:999px;padding:1px 9px;font-weight:700;font-variant-numeric:tabular-nums}
  .basket-btn .go{margin-left:auto;color:var(--gold);font-weight:600}
  .bline{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--hair);
         border-radius:8px;padding:10px 11px;margin-top:6px}
  .bline .x{color:var(--rust);font-size:20px;line-height:1;padding:4px 6px;flex:none}

  .backdrop{position:fixed;inset:0;background:rgba(21,32,43,.5);z-index:60;display:none}
  .backdrop.on{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--paper);border-radius:16px 16px 0 0;
         max-height:92vh;overflow-y:auto;display:none;padding:0 14px calc(20px + env(safe-area-inset-bottom));
         box-shadow:0 -12px 40px -20px rgba(0,0,0,.6)}
  .sheet.on{display:block;animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
  .sheet-inner{max-width:540px;margin:0 auto}
  .grab{width:38px;height:4px;border-radius:2px;background:var(--hair);margin:9px auto 4px}
  .sheet h3{font-family:'Barlow Condensed',sans-serif;font-size:25px;margin:6px 0 2px;font-weight:700;line-height:1.1}
  .code-line{font-size:13.5px;color:var(--ink-soft);margin-bottom:12px}
  .avail-box{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
  .avail-box .big{font-size:44px}
  .stepper{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);padding:6px}
  .stepper button{width:46px;height:46px;border-radius:8px;background:#EDF1F5;font-size:24px;line-height:1}
  .stepper input{border:0;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;padding:0;background:transparent}
  .who{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .who button{background:var(--surface);border:1px solid var(--hair);border-radius:999px;padding:6px 12px;font-size:13.5px}
  .danger{color:var(--rust);font-weight:500;font-size:14.5px;text-align:center;display:block;width:100%;padding:12px}

  nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--hair);padding-bottom:env(safe-area-inset-bottom)}
  .tabs{display:flex;max-width:540px;margin:0 auto}
  .tab{flex:1;padding:9px 4px 10px;text-align:center;color:var(--ink-soft)}
  .tab .tl{font-size:12px;font-weight:500}
  .tab svg{display:block;margin:0 auto 3px;width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tab.on{color:var(--ink)}
  .tab.on .tl{font-weight:600}
  .badge{display:inline-block;min-width:17px;background:var(--rust);color:#fff;border-radius:9px;font-size:11px;font-weight:600;padding:0 5px;margin-left:3px;vertical-align:1px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));
         background:var(--ink);color:#fff;padding:11px 17px;border-radius:999px;font-size:14.5px;z-index:70;
         box-shadow:0 8px 24px -10px rgba(0,0,0,.6);max-width:90%}
  .gate{position:fixed;inset:0;background:var(--paper);z-index:90;overflow-y:auto;display:none}
  .gate.on{display:block}
  .gate-inner{max-width:460px;margin:0 auto;padding:38px 18px 40px}
  .gate h1{font-family:'Barlow Condensed',sans-serif;font-size:32px;margin:0 0 4px;font-weight:700}
  .gate p{color:var(--ink-soft);font-size:14.5px;margin:0 0 6px}
  .err{color:var(--rust);font-size:14px;margin-top:10px;display:none}
  .err.on{display:block}
</style>
</head>
<body>

<div class="gate on" id="gate"><div class="gate-inner" id="gateBody"></div></div>

<header>
  <div class="wrap hbar">
    <div>
      <div class="htitle" id="storeName">EUS Assets</div>
      <div class="hsub"><span class="live-dot" id="liveDot"></span><span id="storeSub">Connecting…</span></div>
    </div>
    <div class="hspace"></div>
    <button class="chip" data-act="settings"><span class="dot" id="syncDot"></span><span id="meName">Set name</span></button>
  </div>
</header>
<div class="banner" id="banner"><span id="bannerText"></span></div>

<main class="wrap">
  <section class="screen on" id="s-scan">
    <div class="viewport brackets" id="vp">
      <i></i><i></i><i></i><i></i>
      <div class="guide"></div>
      <video id="cam" playsinline muted autoplay></video>
      <div id="reader"></div>
      <div class="vp-idle" id="vpIdle">Scan an asset tag, serial barcode or shelf item to issue it or take it back.</div>
      <button class="torch" id="torch" data-act="torch">Light</button>
    </div>
    <button class="btn mt" data-act="camera" id="camBtn">Start camera</button>
    <label class="lbl" for="manual">Or type a tag, serial or item code</label>
    <div class="field">
      <input type="text" id="manual" inputmode="search" autocomplete="off" placeholder="e.g. GF-LAP-0142">
      <button class="btn dark" style="width:88px;flex:none" data-act="lookup">Find</button>
    </div>
    <div class="row mt"><button class="btn ghost" data-act="kits">Load a kit</button>
      <button class="btn ghost" data-act="clear-basket" id="clearBtn">Clear basket</button></div>
    <p class="hint">A handheld barcode scanner works too — just scan while this screen is open.</p>
  </section>

  <section class="screen" id="s-stock">
    <input type="text" id="search" placeholder="Search name, serial, category or shelf" autocomplete="off">
    <div class="row mt-s">
      <button class="btn dark" data-act="new">Add item</button>
      <button class="btn ghost" data-act="import">Import a list</button>
    </div>
    <div id="stockList"></div>
  </section>

  <section class="screen" id="s-out">
    <input type="text" id="pSearch" placeholder="Search by employee name" autocomplete="off">
    <div class="section-head"><h2>Issued</h2><span class="count" id="outCount"></span></div>
    <div id="outList"></div>
  </section>

  <section class="screen" id="s-log">
    <div class="section-head"><h2>Activity</h2><span class="count" id="logCount"></span></div>
    <div id="logList"></div>
    <div class="row mt-l">
      <button class="btn ghost" data-act="export-stock">Export stock</button>
      <button class="btn ghost" data-act="export-assets">Export assets</button>
    </div>
    <button class="btn ghost mt" data-act="export-log">Export activity</button>
    <div style="height:20px"></div>
  </section>
</main>

<div class="basket-bar" id="basketBar"><div class="basket-inner">
  <button class="basket-btn" data-act="basket"><span class="chipn" id="bCount">0</span>
    <span>ready to issue</span><span class="go">Review →</span></button>
</div></div>

<nav>
  <div class="tabs">
    <button class="tab on" data-tab="scan">
      <svg viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M3 12h18"/></svg>
      <span class="tl">Scan</span></button>
    <button class="tab" data-tab="stock">
      <svg viewBox="0 0 24 24"><path d="M3 9h18M3 15h18M6 4h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>
      <span class="tl">Stock</span></button>
    <button class="tab" data-tab="out">
      <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 7a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span class="tl" id="outTabLabel">Issued</span></button>
    <button class="tab" data-tab="log">
      <svg viewBox="0 0 24 24"><path d="M12 8v4l3 2M21 12a9 9 0 1 1-9-9M21 3v6h-6"/></svg>
      <span class="tl">Activity</span></button>
  </div>
</nav>

<div class="backdrop" id="backdrop" data-act="close"></div>
<div class="sheet" id="sheet"><div class="sheet-inner"><div class="grab"></div><div id="sheetBody"></div></div></div>
<script>
/* =======================================================================
   PASTE YOUR FIREBASE CONFIG HERE (Project settings > General > Your apps)
   ======================================================================= */
var FIREBASE_CONFIG = {
 const firebaseConfig = {
  apiKey: "AIzaSyBIl5pA22jrG3XV0U9nYVDNjxr3oJSRPiE",
  authDomain: "eus-store.firebaseapp.com",
  projectId: "eus-store",
  storageBucket: "eus-store.firebasestorage.app",
  messagingSenderId: "562895723842",
  appId: "1:562895723842:web:58d11c76a9350d64d57cdb",
  measurementId: "G-CGNCSN3073
};
var SDK='https://www.gstatic.com/firebasejs/10.12.2/';

var S={items:{},units:{},out:[],log:[],kits:{},meta:{name:'EUS Assets'}};
var ME={name:''}, basket=[];
var view='scan', sheetState=null, ready=false, fb=null, me=null, online=true, justChanged={};

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function idOf(code){return encodeURIComponent(code);}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
var TYPES={asset:'Serialised asset',returnable:'Returnable',consumable:'Consumable'};

/* ===================== gate ===================== */
function loadConfig(){
  if(FIREBASE_CONFIG&&FIREBASE_CONFIG.projectId) return FIREBASE_CONFIG;
  var s=lsGet('eus:fbconfig');
  if(s){ try{ return JSON.parse(s); }catch(e){} }
  return null;
}
function showGate(h){ $('gateBody').innerHTML=h; $('gate').classList.add('on'); }
function hideGate(){ $('gate').classList.remove('on'); }
function gateErr(id,msg){ var el=$(id); if(el){ el.textContent=msg; el.classList.add('on'); } }
function configGate(){
  showGate('<h1>Connect EUS Assets</h1>'+
    '<p>Paste the Firebase config object from your project settings.</p>'+
    '<textarea id="cfg" class="mono" style="min-height:190px;font-size:13px"></textarea>'+
    '<button class="btn mt" data-act="save-config">Connect</button><div class="err" id="cfgErr"></div>');
}
function loginGate(){
  showGate('<h1>Sign in</h1><p>Use the account your admin created in Firebase.</p>'+
    '<label class="lbl">Email</label><input type="email" id="li-email" autocomplete="username" inputmode="email">'+
    '<label class="lbl">Password</label><input type="password" id="li-pass" autocomplete="current-password">'+
    '<button class="btn mt-l" data-act="signin">Sign in</button><div class="err" id="liErr"></div>');
}
function errorGate(msg){
  showGate('<h1>Cannot start</h1><p>'+esc(msg)+'</p>'+
    '<button class="btn mt" data-act="reset-config">Enter a different config</button>');
}

/* ===================== firebase ===================== */
async function boot(){
  var cfg=loadConfig();
  if(!cfg){ configGate(); return; }
  try{
    var appMod=await import(SDK+'firebase-app.js');
    var authMod=await import(SDK+'firebase-auth.js');
    var fsMod=await import(SDK+'firebase-firestore.js');
    var app=appMod.initializeApp(cfg);
    var db=fsMod.initializeFirestore(app,{localCache:fsMod.persistentLocalCache({tabManager:fsMod.persistentMultipleTabManager()})});
    fb={app:app,db:db,auth:authMod.getAuth(app),A:authMod,F:fsMod};
    authMod.onAuthStateChanged(fb.auth,function(u){
      me=u; if(!u){ loginGate(); return; } hideGate(); startListeners();
    });
  }catch(e){
    errorGate('Firebase could not load. This page must be opened from its https address with internet access. ['+(e&&e.message||e)+']');
  }
}
async function signIn(){
  var email=($('li-email').value||'').trim(), pass=$('li-pass').value||'';
  if(!email||!pass) return gateErr('liErr','Enter your email and password.');
  try{ await fb.A.signInWithEmailAndPassword(fb.auth,email,pass); }
  catch(e){
    var c=(e&&e.code)||'';
    gateErr('liErr', c.indexOf('api-key')>=0 ? 'The apiKey in this file is not valid — check Part C of the guide.'
      : (c.indexOf('invalid')>=0||c.indexOf('wrong-password')>=0||c.indexOf('user-not-found')>=0) ? 'That email or password was not accepted.'
      : c.indexOf('network')>=0 ? 'No connection to Firebase right now.' : 'Sign in failed. '+c);
  }
}
var unsub=[];
function startListeners(){
  var F=fb.F, db=fb.db;
  unsub.forEach(function(u){try{u();}catch(e){}}); unsub=[];
  unsub.push(F.onSnapshot(F.collection(db,'items'),{includeMetadataChanges:true},function(s){
    var n={}; s.forEach(function(d){ var v=d.data(); if(v&&v.code){ v.type=v.type||'returnable'; n[v.code]=v; } });
    s.docChanges().forEach(function(ch){ if(ch.type!=='added'&&!s.metadata.hasPendingWrites){
      var v=ch.doc.data(); if(v&&v.code) justChanged[v.code]=Date.now(); }});
    S.items=n; setOnline(!s.metadata.fromCache); ready=true; render();
  },listenErr));
  unsub.push(F.onSnapshot(F.collection(db,'units'),function(s){
    var n={}; s.forEach(function(d){ var v=d.data(); v.id=d.id; n[d.id]=v; });
    S.units=n; render();
  },listenErr));
  unsub.push(F.onSnapshot(F.collection(db,'out'),function(s){
    var a=[]; s.forEach(function(d){ var v=d.data(); v.id=d.id; a.push(v); });
    a.sort(function(x,y){return x.ts-y.ts;}); S.out=a; render();
  },listenErr));
  unsub.push(F.onSnapshot(F.query(F.collection(db,'log'),F.orderBy('ts','desc'),F.limit(150)),function(s){
    var a=[]; s.forEach(function(d){ var v=d.data(); v.id=d.id; a.push(v); });
    S.log=a.reverse(); render();
  },listenErr));
  unsub.push(F.onSnapshot(F.collection(db,'kits'),function(s){
    var n={}; s.forEach(function(d){ var v=d.data(); v.id=d.id; n[d.id]=v; });
    S.kits=n; render();
  },listenErr));
  unsub.push(F.onSnapshot(F.doc(db,'meta','store'),function(d){
    S.meta=d.exists()?d.data():{name:'EUS Assets'};
    if(!S.meta.name) S.meta.name='EUS Assets'; render();
  },listenErr));
  var sm=lsGet('eus:me'); if(sm){ try{ ME=JSON.parse(sm); }catch(e){} }
  if(!ME.name&&me&&me.email) ME.name=me.email.split('@')[0];
  var sb=lsGet('eus:basket'); if(sb){ try{ basket=JSON.parse(sb)||[]; }catch(e){} }
  render();
}
function listenErr(e){
  var c=(e&&e.code)||'';
  banner(c.indexOf('permission')>=0
    ? 'Your account cannot read this store — re-paste the security rules (they now need units and kits).'
    : 'Connection problem: '+c);
  setOnline(false);
}
function setOnline(v){
  online=v; $('liveDot').classList.toggle('off',!v);
  $('storeSub').textContent = v ? liveText() : 'Offline — changes sync when you reconnect';
  if(v) banner('');
}
function liveText(){
  var n=Object.keys(S.items).length, u=Object.keys(S.units).length;
  return 'Live · '+n+' item'+(n===1?'':'s')+(u?' · '+u+' tracked units':'');
}
function banner(msg){ $('banner').classList.toggle('on',!!msg); if(msg) $('bannerText').textContent=msg; }

/* ===================== model helpers ===================== */
function unitsOf(code){
  return Object.keys(S.units).map(function(k){return S.units[k];})
    .filter(function(u){return u.code===code && u.status!=='retired';});
}
function freeUnits(code){ return unitsOf(code).filter(function(u){return u.status==='in';}); }
function outQty(code){ var i=S.items[code]; return i?(i.outCount||0):0; }
function availFor(code){
  var i=S.items[code]; if(!i) return 0;
  if(i.type==='asset') return freeUnits(code).length;
  if(i.type==='consumable') return Math.max(0,i.total||0);
  return Math.max(0,(i.total||0)-(i.outCount||0));
}
function totalFor(code){
  var i=S.items[code]; if(!i) return 0;
  return i.type==='asset' ? unitsOf(code).length : (i.total||0);
}
function stubClass(code){
  var i=S.items[code], a=availFor(code);
  if(!i) return '';
  if(a<=0||a<=(i.min||0)) return ' none';
  if(a<totalFor(code)) return ' part';
  return '';
}
function findUnit(code){
  var k=Object.keys(S.units);
  for(var i=0;i<k.length;i++){
    var u=S.units[k[i]];
    if(u.tag===code||u.serial===code) return u;
  }
  return null;
}
function when(ts){
  var d=new Date(ts), n=new Date();
  var t=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  if(d.toDateString()===n.toDateString()) return 'Today '+t;
  if((n-d)/86400000<2) return 'Yesterday '+t;
  return d.toLocaleDateString([],{day:'numeric',month:'short'})+' '+t;
}
function since(ts){ var n=Math.floor((Date.now()-ts)/86400000); return n<=0?'today':n===1?'1 day':n+' days'; }
function people(){
  var set=[];
  S.log.slice().reverse().forEach(function(l){ if(l.person&&set.indexOf(l.person)<0) set.push(l.person); });
  Object.keys(S.units).forEach(function(k){ var u=S.units[k];
    if(u.person&&set.indexOf(u.person)<0) set.push(u.person); });
  return set.slice(0,8);
}
var toastT;
function toast(m){
  var o=document.querySelector('.toast'); if(o) o.remove();
  var el=document.createElement('div'); el.className='toast'; el.textContent=m;
  document.body.appendChild(el); clearTimeout(toastT); toastT=setTimeout(function(){el.remove();},2600);
}
function feedback(){
  try{ if(navigator.vibrate) navigator.vibrate(35); }catch(e){}
  try{
    var c=new (window.AudioContext||window.webkitAudioContext)();
    var o=c.createOscillator(), g=c.createGain();
    o.frequency.value=1180; o.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(.001,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.14,c.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.13);
    o.start(); o.stop(c.currentTime+.14);
  }catch(e){}
}
function saveMe(){ lsSet('eus:me',JSON.stringify(ME)); }
function saveBasket(){ lsSet('eus:basket',JSON.stringify(basket)); }
function logEntry(d){ return Object.assign({ts:Date.now(),by:(me&&me.email)||''},d); }

/* ===================== basket ===================== */
function basketCount(){ return basket.reduce(function(n,b){return n+(b.qty||1);},0); }
function addToBasket(line){
  if(line.kind==='unit'){
    for(var i=0;i<basket.length;i++) if(basket[i].unitId===line.unitId){ toast('Already in the basket'); return; }
    basket.push(line);
  }else{
    var found=null;
    basket.forEach(function(b){ if(b.kind==='qty'&&b.code===line.code) found=b; });
    if(found) found.qty+=line.qty; else basket.push(line);
  }
  saveBasket(); feedback(); toast(line.name+' added'); render();
}
function removeLine(i){ basket.splice(i,1); saveBasket(); render(); drawSheet(); }
function clearBasket(){ basket=[]; saveBasket(); render(); }

async function issueBasket(person,note){
  if(!basket.length) return;
  if(!person) return toast('Enter who it is being issued to');
  var F=fb.F, db=fb.db, ops=[], err=null;
  basket.forEach(function(b){
    if(b.kind==='unit'){ ops.push({type:'unit',id:b.unitId,name:b.name,code:b.code,serial:b.serial}); }
    else if(b.kind==='model'){
      var free=freeUnits(b.code).slice(0,b.qty);
      if(free.length<b.qty) err='Only '+free.length+' of '+b.name+' are in the store';
      free.forEach(function(u){ ops.push({type:'unit',id:u.id,name:b.name,code:b.code,serial:u.serial||u.tag}); });
    }else{
      var it=S.items[b.code];
      if(!it){ err=b.name+' no longer exists'; return; }
      if(b.qty>availFor(b.code)) err='Only '+availFor(b.code)+' of '+b.name+' available';
      ops.push({type:it.type==='consumable'?'consume':'lend',code:b.code,name:b.name,qty:b.qty});
    }
  });
  if(err) return toast(err);
  try{
    if(online && navigator.onLine){
      await F.runTransaction(db, async function(tx){
        var reads={};
        for(var i=0;i<ops.length;i++){
          var o=ops[i];
          if(o.type==='unit'){ reads[o.id]=await tx.get(F.doc(db,'units',o.id)); }
          else { reads[o.code]=await tx.get(F.doc(db,'items',idOf(o.code))); }
        }
        for(var j=0;j<ops.length;j++){
          var op=ops[j];
          if(op.type==='unit'){
            var us=reads[op.id];
            if(!us.exists()||us.data().status!=='in') throw new Error('taken:'+op.serial);
            tx.update(F.doc(db,'units',op.id),{status:'issued',person:person,since:Date.now(),note:note||''});
            tx.set(F.doc(F.collection(db,'log')),logEntry({code:op.code,name:op.name,action:'issue',qty:1,person:person,serial:op.serial||''}));
          }else{
            var is=reads[op.code], d=is.data();
            if(op.type==='consume'){
              if((d.total||0)<op.qty) throw new Error('short:'+op.name);
              tx.update(F.doc(db,'items',idOf(op.code)),{total:(d.total||0)-op.qty});
              tx.set(F.doc(F.collection(db,'log')),logEntry({code:op.code,name:op.name,action:'issue',qty:op.qty,person:person}));
            }else{
              if((d.total||0)-(d.outCount||0)<op.qty) throw new Error('short:'+op.name);
              tx.update(F.doc(db,'items',idOf(op.code)),{outCount:(d.outCount||0)+op.qty});
              tx.set(F.doc(F.collection(db,'out')),{code:op.code,name:op.name,qty:op.qty,person:person,ts:Date.now(),by:(me&&me.email)||''});
              tx.set(F.doc(F.collection(db,'log')),logEntry({code:op.code,name:op.name,action:'out',qty:op.qty,person:person}));
            }
          }
        }
      });
    }else{
      var batch=F.writeBatch(db);
      ops.forEach(function(op){
        if(op.type==='unit'){
          batch.update(F.doc(db,'units',op.id),{status:'issued',person:person,since:Date.now(),note:note||''});
          batch.set(F.doc(F.collection(db,'log')),logEntry({code:op.code,name:op.name,action:'issue',qty:1,person:person,serial:op.serial||''}));
        }else if(op.type==='consume'){
          batch.update(F.doc(db,'items',idOf(op.code)),{total:F.increment(-op.qty)});
          batch.set(F.doc(F.collection(db,'log')),logEntry({code:op.code,name:op.name,action:'issue',qty:op.qty,person:person}));
        }else{
          batch.update(F.doc(db,'items',idOf(op.code)),{outCount:F.increment(op.qty)});
          batch.set(F.doc(F.collection(db,'out')),{code:op.code,name:op.name,qty:op.qty,person:person,ts:Date.now(),by:(me&&me.email)||''});
          batch.set(F.doc(F.collection(db,'log')),logEntry({code:op.code,name:op.name,action:'out',qty:op.qty,person:person}));
        }
      });
      await batch.commit();
    }
    var n=basketCount();
    clearBasket(); closeSheet();
    toast(n+' issued to '+person);
  }catch(e){
    var m=String(e.message||e);
    if(m.indexOf('taken:')===0) toast('Someone just issued '+m.split(':')[1]);
    else if(m.indexOf('short:')===0) toast('Not enough '+m.split(':')[1]+' left');
    else toast('Could not complete the issue');
  }
}

/* ===================== other writes ===================== */
async function returnUnit(id,to){
  var F=fb.F, db=fb.db, u=S.units[id]; if(!u) return;
  var it=S.items[u.code];
  var b=F.writeBatch(db);
  b.update(F.doc(db,'units',id),{status:to||'in',person:'',since:Date.now()});
  b.set(F.doc(F.collection(db,'log')),logEntry({code:u.code,name:it?it.name:u.code,
    action:to==='repair'?'repair':to==='retired'?'retire':'return',qty:1,person:u.person||'',serial:u.serial||u.tag||''}));
  try{ await b.commit(); toast(to==='repair'?'Marked for repair':to==='retired'?'Retired':'Back in store'); }
  catch(e){ toast('Could not update that unit'); }
}
async function returnQty(code,qty,person){
  var F=fb.F, db=fb.db, it=S.items[code];
  var mine=S.out.filter(function(o){return o.code===code&&(!person||o.person===person);}).sort(function(a,b){return a.ts-b.ts;});
  var left=qty, b=F.writeBatch(db);
  mine.forEach(function(o){
    if(left<=0) return;
    var take=Math.min(o.qty,left); left-=take;
    if(take===o.qty) b.delete(F.doc(db,'out',o.id)); else b.update(F.doc(db,'out',o.id),{qty:o.qty-take});
  });
  var moved=qty-left;
  if(!moved) return toast('Nothing to return');
  b.update(F.doc(db,'items',idOf(code)),{outCount:F.increment(-moved)});
  b.set(F.doc(F.collection(db,'log')),logEntry({code:code,name:it?it.name:code,action:'return',qty:moved,person:person||''}));
  try{ await b.commit(); toast(moved+' returned'); }catch(e){ toast('Could not save that return'); }
}
async function returnAllFor(person){
  var F=fb.F, db=fb.db, b=F.writeBatch(db), n=0;
  Object.keys(S.units).forEach(function(k){
    var u=S.units[k];
    if(u.status==='issued'&&u.person===person){
      b.update(F.doc(db,'units',k),{status:'in',person:'',since:Date.now()});
      var it=S.items[u.code];
      b.set(F.doc(F.collection(db,'log')),logEntry({code:u.code,name:it?it.name:u.code,action:'return',qty:1,person:person,serial:u.serial||u.tag||''}));
      n++;
    }
  });
  S.out.filter(function(o){return o.person===person;}).forEach(function(o){
    b.delete(F.doc(db,'out',o.id));
    b.update(F.doc(db,'items',idOf(o.code)),{outCount:F.increment(-o.qty)});
    b.set(F.doc(F.collection(db,'log')),logEntry({code:o.code,name:o.name,action:'return',qty:o.qty,person:person}));
    n+=o.qty;
  });
  if(!n) return toast('Nothing to return');
  try{ await b.commit(); toast(n+' returned from '+person); closeSheet(); }
  catch(e){ toast('Could not return everything'); }
}
async function writeItem(d,isNew){
  var F=fb.F, db=fb.db;
  var p={code:d.code,name:d.name,type:d.type,category:d.category,location:d.location,min:d.min,notes:d.notes};
  if(d.type!=='asset'){ p.total=d.total; if(isNew) p.outCount=0; }
  else if(isNew){ p.total=0; p.outCount=0; }
  try{
    await F.setDoc(F.doc(db,'items',idOf(d.code)),p,{merge:true});
    await F.setDoc(F.doc(F.collection(db,'log')),logEntry({code:d.code,name:d.name,action:isNew?'add':'edit',qty:d.total||0,person:ME.name}));
    toast(isNew?'Added':'Saved');
  }catch(e){ toast('Could not save the item'); }
}
async function addUnits(code,lines){
  var F=fb.F, db=fb.db, it=S.items[code], b=F.writeBatch(db), n=0;
  lines.forEach(function(l){
    var parts=l.split(/[,\t]/).map(function(s){return s.trim();});
    var serial=parts[0], tag=parts[1]||'';
    if(!serial) return;
    b.set(F.doc(F.collection(db,'units')),{code:code,serial:serial,tag:tag,status:'in',person:'',since:Date.now(),notes:''});
    n++;
  });
  if(!n) return toast('No serials found');
  b.set(F.doc(F.collection(db,'log')),logEntry({code:code,name:(it?it.name:code)+' — '+n+' units added',action:'add',qty:n,person:ME.name}));
  try{ await b.commit(); toast(n+' units added'); }catch(e){ toast('Could not add those units'); }
}
async function saveUnit(id,serial,tag,notes){
  try{ await fb.F.setDoc(fb.F.doc(fb.db,'units',id),{serial:serial,tag:tag,notes:notes},{merge:true}); toast('Saved'); }
  catch(e){ toast('Could not save'); }
}
async function deleteUnit(id){
  try{ await fb.F.deleteDoc(fb.F.doc(fb.db,'units',id)); toast('Unit deleted'); closeSheet(); }
  catch(e){ toast('Could not delete'); }
}
async function removeItem(code){
  var F=fb.F, db=fb.db, it=S.items[code], b=F.writeBatch(db);
  b.delete(F.doc(db,'items',idOf(code)));
  S.out.filter(function(o){return o.code===code;}).forEach(function(o){ b.delete(F.doc(db,'out',o.id)); });
  Object.keys(S.units).forEach(function(k){ if(S.units[k].code===code) b.delete(F.doc(db,'units',k)); });
  b.set(F.doc(F.collection(db,'log')),logEntry({code:code,name:it.name,action:'remove',qty:0,person:ME.name}));
  try{ await b.commit(); toast('Removed'); }catch(e){ toast('Could not remove that'); }
}
async function bulkAdd(rows){
  var F=fb.F, db=fb.db, added=0, skipped=0, b=F.writeBatch(db), n=0;
  for(var i=0;i<rows.length;i++){
    var r=rows[i];
    if(S.items[r.code]){ skipped++; continue; }
    b.set(F.doc(db,'items',idOf(r.code)),{code:r.code,name:r.name,type:r.type,total:r.type==='asset'?0:r.total,
      outCount:0,category:r.category||'',location:r.location||'',min:0,notes:''});
    added++; n++;
    if(n>=400){ await b.commit(); b=F.writeBatch(db); n=0; }
  }
  if(added) b.set(F.doc(F.collection(db,'log')),logEntry({code:'',name:added+' items imported',action:'add',qty:added,person:ME.name}));
  try{ await b.commit(); }catch(e){ toast('Import failed part way'); }
  toast(added+' added'+(skipped?', '+skipped+' skipped':''));
}

/* ===================== render ===================== */
function render(){
  $('storeName').textContent=S.meta.name||'EUS Assets';
  if(online) $('storeSub').textContent = ready?liveText():'Connecting…';
  $('meName').textContent = ME.name||'Set name';
  var screens=document.querySelectorAll('.screen');
  for(var i=0;i<screens.length;i++) screens[i].classList.toggle('on',screens[i].id==='s-'+view);
  var tabs=document.querySelectorAll('.tab');
  for(var j=0;j<tabs.length;j++) tabs[j].classList.toggle('on',tabs[j].dataset.tab===view);
  var held=custody(), holders=Object.keys(held).length;
  $('outTabLabel').innerHTML='Issued'+(holders?'<span class="badge num">'+holders+'</span>':'');
  var bc=basketCount();
  $('bCount').textContent=bc;
  $('basketBar').classList.toggle('on',bc>0);
  document.body.classList.toggle('has-basket',bc>0);
  $('clearBtn').style.display=bc?'block':'none';
  renderStock(); renderOut(); renderLog();
  if(sheetState) drawSheet();
}
function custody(){
  var g={};
  Object.keys(S.units).forEach(function(k){
    var u=S.units[k];
    if(u.status!=='issued'||!u.person) return;
    (g[u.person]=g[u.person]||{units:[],outs:[]}).units.push(u);
  });
  S.out.forEach(function(o){
    var p=o.person||'Unassigned';
    (g[p]=g[p]||{units:[],outs:[]}).outs.push(o);
  });
  return g;
}
function renderStock(){
  var q=$('search').value.trim().toLowerCase();
  var list=Object.keys(S.items).map(function(k){return S.items[k];})
    .sort(function(a,b){return String(a.name).localeCompare(String(b.name));});
  if(q) list=list.filter(function(i){
    if(((i.name||'')+' '+(i.category||'')+' '+(i.location||'')+' '+i.code).toLowerCase().indexOf(q)>=0) return true;
    return unitsOf(i.code).some(function(u){
      return ((u.serial||'')+' '+(u.tag||'')+' '+(u.person||'')).toLowerCase().indexOf(q)>=0; });
  });
  var el=$('stockList');
  if(!list.length){
    el.innerHTML='<div class="empty">'+(q?'Nothing matches "'+esc(q)+'".':
      ready?'No items yet. Add one, or import a list.':'Loading…')+'</div>';
    return;
  }
  var now=Date.now();
  el.innerHTML='<div class="list">'+list.map(function(i){
    var a=availFor(i.code), t=totalFor(i.code), low=a<=(i.min||0);
    var fresh=justChanged[i.code]&&now-justChanged[i.code]<1500?' flash':'';
    return '<button class="tag'+fresh+'" data-act="open" data-code="'+esc(i.code)+'">'+
      '<span class="stub'+stubClass(i.code)+'"></span><span class="tag-body">'+
      '<span class="tag-name">'+esc(i.name)+'</span><span class="tag-meta">'+
      (i.type==='asset'?'<span class="pill">Serialised</span>':i.type==='consumable'?'<span class="pill">Consumable</span>':'')+
      (i.location?'<span class="pill">'+esc(i.location)+'</span>':'')+
      (i.category?'<span class="pill">'+esc(i.category)+'</span>':'')+
      (low?'<span class="pill low">Running low</span>':'')+'</span></span>'+
      '<span class="tag-count"><span class="big'+(low?' low':'')+'">'+a+'</span>'+
      '<span class="small">'+(i.type==='consumable'?'in stock':'of '+t)+'</span></span></button>';
  }).join('')+'</div>';
}
function renderOut(){
  var el=$('outList'), g=custody(), q=($('pSearch').value||'').trim().toLowerCase();
  var names=Object.keys(g).sort();
  if(q) names=names.filter(function(n){return n.toLowerCase().indexOf(q)>=0;});
  var total=0;
  Object.keys(g).forEach(function(n){ total+=g[n].units.length+g[n].outs.reduce(function(a,o){return a+o.qty;},0); });

function drawSheet(){
  var b=$('sheetBody'), st=sheetState; if(!st) return;
  if(st.mode==='item'){ if(!S.items[st.code]){ closeSheet(); return; } b.innerHTML=itemSheet(st); }
  else if(st.mode==='unit'){ if(!S.units[st.id]){ closeSheet(); return; } b.innerHTML=unitSheet(st); }

  else if(st.mode==='units') b.innerHTML=addUnitsSheet(st);

/* ===================== lookup + exports ===================== */
function lookup(code){
  code=(code||'').trim(); if(!code) return;
  var u=findUnit(code);
  if(u){ openSheet({mode:'unit',id:u.id}); return; }
  if(S.items[code]){ openSheet({mode:'item',code:code,qty:1}); return; }
  toast('Not on file yet — adding it');
  openSheet({mode:'form',isNew:true,item:{code:code,name:'',type:'returnable',category:'',location:'',total:1,min:0,notes:''}});
}
function toCSV(rows){
  return rows.map(function(r){ return r.map(function(v){
    v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(','); }).join('\n');
}
function exportStock(){
  var rows=[['Name','Code','Type','Available','Total','Issued','Category','Shelf','Warn at']];
  Object.keys(S.items).forEach(function(k){ var i=S.items[k];
    rows.push([i.name,i.code,TYPES[i.type],availFor(i.code),totalFor(i.code),
      i.type==='asset'?unitsOf(i.code).filter(function(u){return u.status==='issued';}).length:outQty(i.code),
      i.category,i.location,i.min]); });
  openSheet({mode:'text',title:'Stock export',text:toCSV(rows)});
}
function exportAssets(){
  var rows=[['Item','Serial','Asset tag','Status','Holder','Since','Notes']];
  Object.keys(S.units).forEach(function(k){ var u=S.units[k], it=S.items[u.code];
    rows.push([it?it.name:u.code,u.serial||'',u.tag||'',u.status,u.person||'',
      u.since?new Date(u.since).toISOString().slice(0,10):'',u.notes||'']); });
  openSheet({mode:'text',title:'Asset register',text:toCSV(rows)});
}
function exportLog(){
  var rows=[['When','Action','Item','Serial','Code','Qty','Person','Account']];
  S.log.slice().reverse().forEach(function(l){
    rows.push([new Date(l.ts).toISOString(),l.action,l.name,l.serial||'',l.code,l.qty,l.person||'',l.by||'']); });
  openSheet({mode:'text',title:'Activity export',text:toCSV(rows)});
}
async function handover(person){
  var g=custody()[person]||{units:[],outs:[]};
  var lines=[];
  lines.push('ASSET HANDOVER — '+(S.meta.name||'EUS Assets'));
  lines.push('Issued to: '+person);
  lines.push('Date: '+new Date().toLocaleDateString());
  lines.push('Issued by: '+(ME.name||(me&&me.email)||''));
  lines.push('');
  lines.push('EQUIPMENT ON LOAN (must be returned)');
  if(!g.units.length&&!g.outs.length) lines.push('  none');
  g.units.forEach(function(u){
    var it=S.items[u.code];
    lines.push('  '+(it?it.name:u.code)+' | serial '+(u.serial||'-')+' | tag '+(u.tag||'-')+' | since '+new Date(u.since||Date.now()).toLocaleDateString());
  });
  g.outs.forEach(function(o){ lines.push('  '+(o.name||o.code)+' x'+o.qty+' | since '+new Date(o.ts).toLocaleDateString()); });
  try{
    var F=fb.F;
    var snap=await F.getDocs(F.query(F.collection(fb.db,'log'),F.where('person','==',person),F.limit(300)));
    var cons=[];
    snap.forEach(function(d){ var l=d.data();
      if(l.action==='issue'&&!l.serial&&S.items[l.code]&&S.items[l.code].type==='consumable')
        cons.push('  '+l.name+' x'+l.qty+' | '+new Date(l.ts).toLocaleDateString()); });
    lines.push(''); lines.push('CONSUMABLES ISSUED (not returnable)');
    lines.push(cons.length?cons.join('\n'):'  none');
  }catch(e){}
  lines.push('');
  lines.push('I confirm I have received the equipment listed above and that it remains');
  lines.push('the property of the company, to be returned on request or on leaving.');
  lines.push('');
  lines.push('Signature: ______________________   Date: ____________');
  openSheet({mode:'text',title:'Handover — '+person,text:lines.join('\n')});
}

/* ===================== camera ===================== */
var cam={running:false,paused:false,stop:null,track:null,lit:false};
var FORMATS=['code_128','code_39','code_93','ean_13','ean_8','upc_a','upc_e','itf','codabar','qr_code','data_matrix'];
function camError(e){
  var n=(e&&e.name)||'', msg;
  if(n==='NotAllowedError'||n==='SecurityError') msg='Camera access was blocked. Allow the camera for this site, then tap Start camera again.';
  else if(n==='NotFoundError'||n==='OverconstrainedError') msg='No camera was found on this device.';
  else if(n==='NotReadableError') msg='The camera is being used by another app. Close it and try again.';
  else if(!window.isSecureContext) msg='The camera only works over https. Open the hosted address, not the file itself.';
  else msg='The camera could not start. Type the code below, or use a handheld scanner.';
  $('vpIdle').textContent=msg; $('vpIdle').style.display='block';
}
function showVideo(which){
  $('vpIdle').style.display='none';
  $('cam').style.display=which==='native'?'block':'none';
  $('reader').style.display=which==='lib'?'block':'none';
  $('vp').classList.add('live'); $('camBtn').textContent='Stop camera';
}
async function startNative(){
  var sup=await window.BarcodeDetector.getSupportedFormats();
  var want=FORMATS.filter(function(f){return sup.indexOf(f)>=0;});
  if(!want.length) throw new Error('no formats');
  var det=new window.BarcodeDetector({formats:want});
  var stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
  var v=$('cam'); v.srcObject=stream; v.setAttribute('playsinline','true'); await v.play();
  showVideo('native'); cam.track=stream.getVideoTracks()[0];
  try{
    var caps=cam.track.getCapabilities?cam.track.getCapabilities():{};
    if(caps.focusMode&&caps.focusMode.indexOf('continuous')>=0) await cam.track.applyConstraints({advanced:[{focusMode:'continuous'}]});
    if(caps.torch) $('torch').classList.add('on');
  }catch(e){}
  var timer=setInterval(async function(){
    if(cam.paused||document.hidden||v.readyState<2) return;
    try{ var c=await det.detect(v); if(c&&c.length) onScan(c[0].rawValue); }catch(e){}
  },150);
  cam.stop=function(){ clearInterval(timer); stream.getTracks().forEach(function(t){t.stop();}); v.srcObject=null; };
  cam.running=true;
}
var libScanner=null;
async function startLib(){
  if(typeof Html5Qrcode==='undefined') throw new Error('scanner library unavailable');
  var fmts=null;
  try{ var F=Html5QrcodeSupportedFormats;
    fmts=[F.CODE_128,F.CODE_39,F.CODE_93,F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.ITF,F.CODABAR,F.QR_CODE,F.DATA_MATRIX]; }catch(e){}
  libScanner=new Html5Qrcode('reader',{verbose:false,formatsToSupport:fmts,experimentalFeatures:{useBarCodeDetectorIfSupported:true}});
  await libScanner.start({facingMode:{ideal:'environment'}},
    {fps:12,aspectRatio:1.3333,
     qrbox:function(w,h){return {width:Math.floor(Math.min(w*0.88,340)),height:Math.floor(Math.min(h*0.5,190))};},
     videoConstraints:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}},
    function(t){ if(!cam.paused) onScan(t); },function(){});
  showVideo('lib');
  cam.stop=async function(){ try{ await libScanner.stop(); libScanner.clear(); }catch(e){} libScanner=null; };
  cam.running=true;
}
async function toggleCamera(){
  if(cam.running){ await stopCamera(); return; }
  $('vpIdle').textContent='Starting the camera…';
  try{
    if('BarcodeDetector' in window){
      try{ await startNative(); return; }
      catch(e){ if(e&&(e.name==='NotAllowedError'||e.name==='NotFoundError'||e.name==='NotReadableError')) throw e; }
    }
    await startLib();
  }catch(e){
    cam.running=false; $('cam').style.display='none'; $('reader').style.display='none';
    $('vp').classList.remove('live'); $('camBtn').textContent='Start camera'; camError(e);
  }
}
async function stopCamera(){
  try{ if(cam.stop) await cam.stop(); }catch(e){}
  cam.stop=null; cam.running=false; cam.track=null; cam.lit=false;
  $('cam').style.display='none'; $('reader').style.display='none';
  $('torch').classList.remove('on','lit'); $('vp').classList.remove('live');
  $('vpIdle').style.display='block';
  $('vpIdle').textContent='Scan an asset tag, serial barcode or shelf item to issue it or take it back.';
  $('camBtn').textContent='Start camera';
}
async function toggleTorch(){
  if(!cam.track) return;
  cam.lit=!cam.lit;
  try{ await cam.track.applyConstraints({advanced:[{torch:cam.lit}]}); $('torch').classList.toggle('lit',cam.lit); }
  catch(e){ toast('This camera has no light'); }
}
var lastCode='',lastAt=0;
function onScan(t){
  if(!t) return;
  var now=Date.now();
  if(t===lastCode&&now-lastAt<2500) return;
  lastCode=t; lastAt=now; feedback(); lookup(t);
}
var buf='',bufAt=0;
document.addEventListener('keydown',function(e){
  var t=e.target.tagName;
  if(t==='INPUT'||t==='TEXTAREA'||sheetState) return;
  var now=Date.now();
  if(now-bufAt>120) buf='';
  bufAt=now;
  if(e.key==='Enter'){ if(buf.length>=3){ feedback(); lookup(buf); } buf=''; return; }
  if(e.key.length===1) buf+=e.key;
});

/* ===================== events ===================== */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act],[data-tab]');
  if(!el) return;
  var act=el.dataset.act;
  if(el.dataset.tab){ view=el.dataset.tab; if(view!=='scan') stopCamera(); render(); return; }
  switch(act){
    case 'save-config':{
      var raw=$('cfg').value.trim().replace(/^(const|var)\s+firebaseConfig\s*=\s*/,'').replace(/;\s*$/,'');
      var cfg=null;
      try{ cfg=JSON.parse(raw); }catch(err){ try{ cfg=(new Function('return ('+raw+')'))(); }catch(e2){} }
      if(!cfg||!cfg.projectId||!cfg.apiKey) return gateErr('cfgErr','That does not look like a Firebase config.');
      lsSet('eus:fbconfig',JSON.stringify(cfg)); location.reload(); break;
    }
    case 'reset-config': try{localStorage.removeItem('eus:fbconfig');}catch(e){} location.reload(); break;
    case 'signin': signIn(); break;
    case 'signout': fb.A.signOut(fb.auth).then(function(){location.reload();}); break;
    case 'camera': toggleCamera(); break;
    case 'torch': toggleTorch(); break;
    case 'lookup': lookup($('manual').value); $('manual').value=''; break;
    case 'open': lookup(el.dataset.code); break;
    case 'unit': openSheet({mode:'unit',id:el.dataset.id}); break;
    case 'close': closeSheet(); break;
    case 'new': openSheet({mode:'form',isNew:true,item:{code:'',name:'',type:'returnable',category:'',location:'',total:1,min:0,notes:''}}); break;
    case 'edit': openSheet({mode:'form',isNew:false,item:S.items[el.dataset.code]}); break;
    case 'import': openSheet({mode:'import'}); break;
    case 'settings': openSheet({mode:'settings'}); break;
    case 'kits': openSheet({mode:'kits'}); break;
    case 'basket': openSheet({mode:'basket',person:ME.lastPerson||''}); break;
    case 'add-units': openSheet({mode:'units',code:el.dataset.code}); break;
    case 'qty':{
      var i=$('qty'), max=parseInt(i.max||'99',10);
      i.value=Math.min(max,Math.max(1,parseInt(i.value||'1',10)+parseInt(el.dataset.d,10)));
      break;
    }
    case 'basket-unit':{
      var u=S.units[el.dataset.id], it=S.items[u.code];
      addToBasket({kind:'unit',unitId:u.id,code:u.code,name:it?it.name:u.code,serial:u.serial||u.tag,qty:1});
      closeSheet(); break;
    }
    case 'basket-next':{
      var code=el.dataset.code, free=freeUnits(code);
      var taken={}; basket.forEach(function(b){ if(b.unitId) taken[b.unitId]=1; });
      var pick=null;
      for(var z=0;z<free.length;z++) if(!taken[free[z].id]){ pick=free[z]; break; }
      if(!pick){ toast('No free units left'); break; }
      addToBasket({kind:'unit',unitId:pick.id,code:code,name:S.items[code].name,serial:pick.serial||pick.tag,qty:1});
      closeSheet(); break;
    }
    case 'basket-qty':{
      var c=el.dataset.code, q=Math.max(1,parseInt(($('qty')||{}).value||'1',10));
      addToBasket({kind:'qty',code:c,name:S.items[c].name,qty:q,type:S.items[c].type});
      closeSheet(); break;
    }
    case 'rm-line': removeLine(parseInt(el.dataset.i,10)); break;
    case 'who': sheetState.person=el.dataset.p; sheetState.note=($('b-note')||{}).value||''; drawSheet(); break;
    case 'do-issue':{
      var p=($('b-person').value||'').trim(), nt=($('b-note').value||'').trim();
      if(p){ ME.lastPerson=p; if(!ME.name) ME.name=p; saveMe(); }
      issueBasket(p,nt); break;
    }
    case 'clear-basket':
      if(basket.length&&confirm('Empty the basket?')){ clearBasket(); closeSheet(); }
      break;
    case 'save-kit':{
      var nm=prompt('Name this kit (e.g. New joiner pack)');
      if(!nm) break;
      var lines=[];
      basket.forEach(function(b){
        var f=null;
        lines.forEach(function(l){ if(l.code===b.code) f=l; });
        if(f) f.qty+=(b.qty||1); else lines.push({code:b.code,qty:b.qty||1});
      });
      saveKit(nm,lines); break;
    }
    case 'load-kit':{
      var kit=S.kits[el.dataset.id]; if(!kit) break;
      (kit.lines||[]).forEach(function(l){
        var it=S.items[l.code]; if(!it) return;
        if(it.type==='asset'){
          var free=freeUnits(l.code), taken={};
          basket.forEach(function(b){ if(b.unitId) taken[b.unitId]=1; });
          var added=0;
          for(var z=0;z<free.length&&added<l.qty;z++){
            if(taken[free[z].id]) continue;
            basket.push({kind:'unit',unitId:free[z].id,code:l.code,name:it.name,serial:free[z].serial||free[z].tag,qty:1});
            added++;
          }
          if(added<l.qty) toast('Only '+added+' '+it.name+' in store');
        }else{
          var f=null;
          basket.forEach(function(b){ if(b.kind==='qty'&&b.code===l.code) f=b; });
          if(f) f.qty+=l.qty; else basket.push({kind:'qty',code:l.code,name:it.name,qty:l.qty,type:it.type});
        }
      });
      saveBasket(); closeSheet(); render(); toast('Kit loaded into the basket'); break;
    }
    case 'del-kit': if(confirm('Delete this kit?')) deleteKit(el.dataset.id); break;
    case 'do-units':{
      var ls=$('unit-lines').value.split(/\r?\n/).filter(function(l){return l.trim();});
      addUnits(el.dataset.code,ls); closeSheet(); break;
    }
    case 'save-unit': saveUnit(el.dataset.id,($('u-ser').value||'').trim(),($('u-tag').value||'').trim(),($('u-notes').value||'').trim()); break;
    case 'del-unit': if(confirm('Delete this unit permanently?')) deleteUnit(el.dataset.id); break;
    case 'mark': returnUnit(el.dataset.id,el.dataset.to); closeSheet(); break;
    case 'ret-unit': returnUnit(el.dataset.id,'in'); closeSheet(); break;
    case 'ret-qty':{
      var o=null;
      for(var y=0;y<S.out.length;y++) if(S.out[y].id===el.dataset.id) o=S.out[y];
      if(o&&confirm('Return '+o.qty+' x '+(o.name||o.code)+' from '+(o.person||'store')+'?')) returnQty(o.code,o.qty,o.person);
      break;
    }
    case 'ret-item':{
      var cc=el.dataset.code;
      if(confirm('Return all '+outQty(cc)+' to the store?')){ returnQty(cc,outQty(cc),null); closeSheet(); }
      break;
    }
    case 'ret-all': if(confirm('Return everything issued to '+el.dataset.p+'?')) returnAllFor(el.dataset.p); break;
    case 'handover': handover(el.dataset.p); break;
    case 'save-item':{
      var st=sheetState;
      var code=($('f-code').value||'').trim(), name=($('f-name').value||'').trim();
      if(!code) return toast('A code is needed');
      if(!name) return toast('Give it a name');
      if(st.isNew&&S.items[code]) return toast('That code is already used');
      var d={code:code,name:name,type:$('f-type').value,
        category:($('f-cat').value||'').trim(),location:($('f-loc').value||'').trim(),
        total:Math.max(0,parseInt($('f-total').value||'0',10)),
        min:Math.max(0,parseInt($('f-min').value||'0',10)),
        notes:($('f-notes').value||'').trim()};
      writeItem(d,st.isNew);
      if(st.isNew&&d.type==='asset') openSheet({mode:'units',code:code});
      else openSheet({mode:'item',code:code,qty:1});
      break;
    }
    case 'delete':{
      var dc=el.dataset.code, di=S.items[dc];
      if(di&&confirm('Remove '+di.name+' and all its units for everyone?')){ removeItem(dc); closeSheet(); }
      break;
    }
    case 'do-import':{
      var raw2=$('bulk').value.split(/\r?\n/).filter(function(l){return l.trim();});
      var rows=[];
      raw2.forEach(function(line,i){
        var c=line.split(/[,\t]/).map(function(s){return s.trim();});
        if(i===0&&/name/i.test(c[0]||'')&&/barcode|code|tag/i.test(c[1]||'')) return;
        if(!c[0]||!(c[1]||'')) return;
        var ty=(c[5]||'').toLowerCase();
        if(['asset','returnable','consumable'].indexOf(ty)<0) ty='returnable';
        rows.push({name:c[0],code:c[1],total:Math.max(0,parseInt(c[2]||'0',10)||0),category:c[3]||'',location:c[4]||'',type:ty});
      });
      closeSheet(); bulkAdd(rows); view='stock'; render(); break;
    }
    case 'export-stock': exportStock(); break;
    case 'export-assets': exportAssets(); break;
    case 'export-log': exportLog(); break;
    case 'save-settings':
      ME.name=($('s-me').value||'').trim(); saveMe();
      setStoreName(($('s-store').value||'').trim()||'EUS Assets');
      closeSheet(); toast('Saved'); break;
    case 'copy':{
      var ta=$('out-text'); ta.removeAttribute('readonly'); ta.select(); ta.setSelectionRange(0,999999);
      var done=false;
      try{ done=document.execCommand('copy'); }catch(err){}
      if(!done&&navigator.clipboard) navigator.clipboard.writeText(ta.value).then(function(){toast('Copied');});
      else toast(done?'Copied':'Select the text and copy');
      ta.setAttribute('readonly','readonly'); break;
    }
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&$('gate').classList.contains('on')&&$('li-pass')) signIn();
});
$('search').addEventListener('input',renderStock);
$('pSearch').addEventListener('input',renderOut);
$('manual').addEventListener('keydown',function(e){
  if(e.key==='Enter'){ e.preventDefault(); lookup($('manual').value); $('manual').value=''; }
});
window.addEventListener('online',function(){setOnline(true);});
window.addEventListener('offline',function(){setOnline(false);});
boot();
</script>
